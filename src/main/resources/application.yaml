server:
  port: 8088

spring:
  config:
    # Local secrets (DB_USERNAME, DB_PASSWORD, API_PASSWORD) live in a git-ignored .env file
    import: "optional:file:.env[.properties]"
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/springboot_app
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  profiles:
    active: "default"
  security:
    user:
      name: 'api_user'
      password: ${API_PASSWORD}

logging:
  level:
    org:
      springframework:
        security: debug

management:
  endpoints:
    web:
      exposure:
        include: "info,health"

springdoc:
  api-docs:
    path: "/api/api-docs"
    enabled: true
  swagger-ui:
    path: "api/swagger-ui"
    enabled: true