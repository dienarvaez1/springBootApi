server:
  port: 8088

spring:
  config:
    # Local secrets (DB_USERNAME, DB_PASSWORD, API_PASSWORD) live in a git-ignored .env file
    import: "optional:file:.env[.properties]"
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/springboot_app
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # Check the schema matches the entities; the dev profile creates and updates it instead
      ddl-auto: validate
    properties:
      hibernate:
        # Store Instant fields in the existing "timestamp without time zone" columns
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  security:
    user:
      name: 'api_user'
      password: ${API_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: "info,health"

springdoc:
  default-produces-media-type: "application/json"
  api-docs:
    path: "/api/api-docs"
  swagger-ui:
    path: "/api/swagger-ui"
